<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Certificates</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .certificate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      padding: 0 20px;
    }

    .certificate-card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
      text-align: center;
      min-height: 450px;
      cursor: pointer;
    }

    .certificate-card img {
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      border-radius: 8px;
      transition: transform 0.3s;
    }

    .certificate-card img:hover {
      transform: scale(1.03);
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.9);
    }

    .modal-content {
      display: block;
      margin: 5% auto;
      max-width: 90%;
      max-height: 80%;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>My Certificates</h1>

  <div class="certificate-grid">
    <div class="certificate-card" onclick="openModal('certificates/20250427_214812.jpg')">
      <img src="images/certificate1.jpg" alt="Certificate 1" />
    </div>

    <div class="certificate-card" onclick="openModal('certificates/certificate-2.png')">
      <img src="images/certificate-2.png" alt="Certificate 2" />
    </div>
  </div>

  <!-- Modal Structure -->
  <div id="imgModal" class="modal" onclick="closeModal()">
    <span class="close-btn">&times;</span>
    <div class="modal-content">
      <img id="modalImage" src="" alt="Full Certificate View" />
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    function openModal(imageSrc) {
      document.getElementById("modalImage").src = imageSrc;
      document.getElementById("imgModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("imgModal").style.display = "none";
    }

    // Optional: close modal on ESC key
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeModal();
      }
    });
  </script>
</body>
</html>
